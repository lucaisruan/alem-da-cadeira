name: Publicar na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      admin_email:
        description: "Criar (ou trocar a senha da) administradora: e-mail"
        required: false
      admin_nome:
        description: "Nome da administradora"
        required: false
        default: "Luize Freire"

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Conta, banco e domínio
        run: node scripts/ci-preparar.mjs
      - name: Build
        run: npm run build
      - name: Migrações do banco
        run: npx wrangler d1 migrations apply DB --remote
      - name: Publicar
        run: npx wrangler deploy
      - name: Administradora
        if: ${{ inputs.admin_email != '' && inputs.admin_email != null }}
        env:
          ADMIN_EMAIL: ${{ inputs.admin_email }}
          ADMIN_NOME: ${{ inputs.admin_nome }}
        run: node scripts/nova-admin.mjs "$ADMIN_EMAIL" "$ADMIN_NOME" --remote
